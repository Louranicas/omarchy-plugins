[package]
name = "ask-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[workspace]
[dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_14"] }
gtk4-layer-shell = "=0.8.1"
ask-core = { path = "../ask-core" }
ask-runtime = { path = "../ask-runtime" }
ask-files = { path = "../ask-files" }
ask-preview = { path = "../ask-preview" }
acp-transport = { path = "../acp-transport" }
modal-runtime = { path = "../modal-runtime" }
serde_json = "1"
[profile.dev]
debug = 0
[dev-dependencies]
omarchy-process-runner = { path = "../process-runner" }
tempfile = "3"
